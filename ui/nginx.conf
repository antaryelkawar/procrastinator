# nginx site config for the procrastinator-ui SPA.
#
# Installed to /etc/nginx/conf.d/default.conf by the Dockerfile. Because the
# nginx:alpine base already provides the http{} context and
# `include /etc/nginx/conf.d/*.conf;`, this file is a server{} block ONLY
# (no events{} / http{} wrapper).
#
# NOTE on headers: nginx `add_header` directives are NOT inherited into a
# level that defines its own `add_header`. Every location below that needs a
# Cache-Control header declares it locally. Do NOT add server-level `add_header`
# here expecting it to appear inside these locations — it would be silently
# dropped.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip text-like responses; text/plain is on by default and not re-listed.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml
        application/manifest+json;

    # Vite fingerprinted js/css (hashed filenames -> safe to cache forever).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # PWA icons (stable filenames in public/icons/ -> cache forever).
    location /icons/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Entry doc: no-cache so a new deploy serves fresh index.html immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # App service worker: no-cache so PWA updates propagate to clients.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # /api/ belongs to the SEPARATE backend service, not this static SPA.
    # The app's VitePWA config denies the SPA fallback for /api/ paths
    # (navigateFallbackDenylist: [/^\/api\//]), so nginx must NOT serve
    # index.html for them either — return 404 (in prod, /api/ is routed to
    # the backend upstream by the reverse proxy, not by this container).
    location /api/ {
        return 404;
    }

    # SPA fallback: client-side (React Router) deep links resolve to the
    # entry doc instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
