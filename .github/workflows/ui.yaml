name: ui CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'ui/**'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_REGISTRY: ${{ secrets.REGISTRY_URL != '' && secrets.REGISTRY_USERNAME != '' && secrets.REGISTRY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Lint
        working-directory: ui
        run: npm run lint

      - name: Test
        working-directory: ui
        run: npm run test

      - name: Build
        working-directory: ui
        run: npm run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        if: env.HAS_REGISTRY == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        if: env.HAS_REGISTRY == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ui
          push: true
          # amd64 only: the arm64 leg runs npm ci + vite under QEMU on the
          # amd64 runner and took 70+ min without completing (cancelled),
          # vs ~1 min native for amd64. The deploy host (Unraid) is x86_64.
          platforms: linux/amd64
          tags: |
            ${{ secrets.REGISTRY_URL }}/procrastinator-ui:latest
            ${{ secrets.REGISTRY_URL }}/procrastinator-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build (local, no push)
        if: env.HAS_REGISTRY != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ui
          push: false
          load: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
