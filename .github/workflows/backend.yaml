name: backend CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'procrastinator-backend/**'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_REGISTRY: ${{ secrets.REGISTRY_URL != '' && secrets.REGISTRY_USERNAME != '' && secrets.REGISTRY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Vet
        working-directory: procrastinator-backend
        run: go vet ./...

      - name: Test
        working-directory: procrastinator-backend
        run: go test ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: env.HAS_REGISTRY == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        if: env.HAS_REGISTRY == 'true'
        uses: docker/build-push-action@v7
        with:
          context: procrastinator-backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.REGISTRY_URL }}/procrastinator-backend:latest
            ${{ secrets.REGISTRY_URL }}/procrastinator-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build (local, no push)
        if: env.HAS_REGISTRY != 'true'
        uses: docker/build-push-action@v7
        with:
          context: procrastinator-backend
          push: false
          load: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
