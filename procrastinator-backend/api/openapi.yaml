        required: true
        description: The user the resource belongs to (path tenancy).
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: rejectReview
      summary: Reject an ingest review
      description: |
        Discards the candidate of a pending review (no Asset or Document
        created) and transitions the review to rejected. Rejecting a
        non-pending review yields 409. Unknown or another owner's review ids
        yield 404.
      responses:
        "200":
          description: The updated review (state rejected)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ingest_review'
        "404":
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        "409":
          description: Review is not pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    asset:
      type: object
      description: A user asset derived from an ingested document.
      properties:
        id:
          type: string
        owner_household_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        data:
          type: object
          description: The asset payload data (stored shape).
          properties:
            name:
              type: string
              nullable: true
              description: Canonical product name (e.g. "Microwave Oven")
            brand:
              type: string
              nullable: true
            model:
              type: string
              nullable: true
            serial_number:
              type: string
              nullable: true
            asset_category:
              type: string
              nullable: true
              description: Intrinsic category of the asset
              enum:
                - appliance
                - electronics
                - computing
                - furniture
                - vehicle
                - tool
                - clothing
                - document_only
                - other
            category_confidence:
              type: number
              format: float
              nullable: true
              description: Confidence in the category assignment [0.0, 1.0]
            category_user_set:
              type: boolean
              nullable: true
              description: True when the user has manually set the category (sticky).
            purchase_date:
              type: string
              format: date
              nullable: true
            warranty_end:
              type: string
              format: date
              nullable: true
            price:
              type: string
              pattern: '^[0-9]+(\.[0-9]+)?$'
              nullable: true
            currency:
              type: string
              nullable: true
            metadata:
              type: object
              additionalProperties: true
            confidence:
              type: number
              format: float
              nullable: true
            deleted_at:
              type: string
              format: date-time
              nullable: true
              description: Set when the asset is soft-deleted
            merged_into:
              type: string
              nullable: true
              description: Id of the survivor asset if this asset was merged
            merged_at:
              type: string
              format: date-time
              nullable: true
              description: Timestamp of the merge
            merged_assets:
              type: array
              nullable: true
              description: Assets that were merged into this asset (survivor view)
              items:
                type: object
                properties:
                  asset_id:
                    type: string
                  merged_at:
                    type: string
                    format: date-time
                required:
                  - asset_id
                  - merged_at
          required:
            - metadata
      required:
        - id
        - data
        - created_at
        - updated_at
    document:
      type: object
      description: A document attached to an asset, with its source metadata.
      properties:
        id:
          type: string
        asset_id:
          type: string
          nullable: true
          description: The asset this document is linked to (null when detached).
        source_id:
          type: string
        source_filename:
          type: string
        source_uploaded_at:
          type: string
          format: date-time
        owner_household_id:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - processed
            - in_review
            - failed
            - asset_less
          description: |
            Processing status: processed (asset linked), in_review (pending
            review), failed (extraction failed), asset_less (no matching asset).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        data:
          type: object
          description: The document payload data (stored shape).
          properties:
            doc_type:
              type: string
              enum:
                - invoice
                - receipt
                - warranty
                - amc
                - statement
                - other
            confidence:
              type: number
              format: float
              nullable: true
            extracted_fields:
              type: object
              additionalProperties: true
              nullable: true
            raw_extraction:
              type: string
              nullable: true
            user_directive:
              type: string
              nullable: true
          required:
            - doc_type
      required:
        - id
        - source_id
        - source_filename
        - source_uploaded_at
        - status
        - created_at
        - updated_at
        - data
