    post:
      operationId: createImportBatch
      summary: Upload a statement for import
      description: |
        Uploads a statement as `multipart/form-data` with a required `account_id`
        and runs the statement import pipeline. The 201 response carries the
        created preview batch with its parsed lines and source metadata.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                account_id:
                  type: string
              required:
                - file
                - account_id
      responses:
        "201":
          description: The created import batch
          content:
            application/json:
