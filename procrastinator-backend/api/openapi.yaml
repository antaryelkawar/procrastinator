          description: Search query (case-insensitive substring)
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: Page number (1-based)
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: page_size
          in: query
          required: false
          description: Number of results per page
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: category
          in: query
          required: false
          description: Filter by asset category
          schema:
            type: string
        - name: brand
          in: query
          required: false
          description: Filter by brand
          schema:
            type: string
        - name: purchase_from
          in: query
          required: false
          description: Filter by purchase date (from, inclusive)
          schema:
            type: string
            format: date
        - name: purchase_to
          in: query
          required: false
          description: Filter by purchase date (to, inclusive)
