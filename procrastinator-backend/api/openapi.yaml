      description: The structured 409 response when a duplicate document upload is detected.
      properties:
        code:
          type: string
          const: "duplicate"
        existing_document_id:
          type: string
          nullable: true
          description: The existing document id, or null when the duplicate source has no linked document (e.g. statement-classified sources).
        existing_source_filename:
          type: string
        existing_source_uploaded_at:
          type: string
          format: date-time
        existing_asset_id:
          type: string
          nullable: true
        prompt:
          type: object
          description: The reprocess/keep prompt fields for the UI modal.
          properties:
            reprocess_uri:
              type: string
            keep_uri:
              type: string
            expires_at:
              type: string
              format: date-time
            timeout_toast:
              type: string
          required: [reprocess_uri, keep_uri, expires_at, timeout_toast]
      required: [code, existing_source_filename, existing_source_uploaded_at, prompt]
    add_item_outcome_kind:
      type: string
      description: The outcome kind for one add item.
      enum:
        - asset_committed
        - held_for_review
        - duplicate
        - statement_preview
        - failed
    add_item_outcome:
      type: object
      description: The uniform per-item outcome of a unified add request.
      properties:
        kind:
          $ref: '#/components/schemas/add_item_outcome_kind'
        asset_id:
          type: string
          nullable: true
          description: Set when kind is asset_committed
        review_id:
          type: string
          nullable: true
          description: Set when kind is held_for_review
        duplicate_asset_id:
          type: string
          nullable: true
          description: Set when kind is duplicate (the existing asset)
        duplicate_document_id:
          type: string
          nullable: true
          description: Set when kind is duplicate (the existing document)
        asset_deleted:
          type: boolean
          nullable: true
          description: Set when kind is duplicate and the existing asset is soft-deleted
        import_batch_id:
          type: string
          nullable: true
          description: Set when kind is statement_preview
        reason:
          type: string
          nullable: true
          description: Set when kind is failed
      required:
        - kind
    merge_request:
      type: object
      description: Request body to merge a duplicate asset into the target.
      properties:
        duplicate_asset_id:
          type: string
      required:
        - duplicate_asset_id
    patch_asset_request:
      type: object
      description: |
        Request body to patch an asset with user corrections. All fields are
        optional; only provided fields are applied. Setting `asset_category`
        marks it as user-set (sticky against future inference).
      properties:
        name:
          type: string
        asset_category:
          type: string
          enum:
            - appliance
            - electronics
            - computing
            - furniture
            - vehicle
            - tool
            - clothing
            - document_only
            - other
        brand:
          type: string
        model:
          type: string
        serial_number:
          type: string
        price:
          type: string
          pattern: '^[0-9]+(\.[0-9]+)?$'
        currency:
          type: string
