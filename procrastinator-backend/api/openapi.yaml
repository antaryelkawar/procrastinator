        "409":
          description: Conflicting batch state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        "413":
          description: Upload exceeds size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        "415":
          description: Unsupported statement type
          content:
            application/json:
              schema:
