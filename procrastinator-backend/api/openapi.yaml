  /api/users/{userId}/search/quick:
    parameters:
      - name: userId
        in: path
        required: true
        description: The user the resource belongs to (path tenancy).
        schema:
          type: string
    get:
      operationId: quickSearch
      summary: Quick search (typeahead)
      description: |
        Returns a fast, capped set of search hits for typeahead. Accepts
        optional `q` and `limit` query parameters. `limit` defaults to 10 and
        must be in [1,50]. An absent or blank `q` returns 200 with an empty
        result set.
      parameters:
        - name: q
          in: query
          required: false
          description: Search query (case-insensitive substring)
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of hits to return
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
        - name: category
          in: query
          required: false
          description: Filter by asset category
          schema:
            type: string
        - name: brand
          in: query
          required: false
          description: Filter by brand
          schema:
            type: string
        - name: purchase_from
          in: query
          required: false
          description: Filter by purchase date (from, inclusive)
          schema:
            type: string
            format: date
        - name: purchase_to
          in: query
          required: false
          description: Filter by purchase date (to, inclusive)
          schema:
            type: string
            format: date
        - name: warranty_status
          in: query
          required: false
          description: Filter by warranty status (e.g. active, expiring_within:90, expired)
          schema:
            type: string
        - name: has_documents
          in: query
          required: false
          description: Filter to assets that have (true) or lack (false) linked documents
          schema:
            type: boolean
        - name: doc_classification
          in: query
          required: false
          description: Filter by document classification
          schema:
            type: string
            enum:
              - invoice
              - receipt
              - warranty
              - amc
              - statement
              - other
      responses:
        "200":
          description: The quick search hits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/search_quick_response'
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
